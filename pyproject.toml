[project]
name = "tower-borescope"
version = "0.1.0"
description = "Desktop application and USB driver for Geek szitman supercamera borescopes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.5.0",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pydantic==2.13.5",
    "pyside6==6.11.2",
    "python-dotenv>=1.0.1",
    "pyusb==1.3.1",
    "pyvirtualcam==0.15.0",
    "qrcode==8.2",
]

[project.scripts]
tower-borescope = "tower_borescope.cli:main"

[dependency-groups]
dev = [
    "mutmut>=3.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "radon>=6.0",
    "ruff>=0.8",
]
# Application bundle: PyInstaller and the wheel that carries a static ffmpeg build.
build = [
    "imageio-ffmpeg==0.6.0",
    "pyinstaller==6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_borescope"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["_legacy"]

[tool.ruff.lint]
# Same rule selection as the Tower monorepo. C901 enforces the cyclomatic
# complexity ceiling configured below; E501 is covered by the 90-column
# formatter limit and the obs_quality line-length rule.
select = ["E", "F", "I", "W", "B", "UP", "PGH", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tower_borescope"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["tower_borescope"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = ["usb", "usb.*", "qrcode", "qrcode.*", "pyvirtualcam"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Test helper modules (synthetic media, fakes) import each other by module name.
pythonpath = ["tests"]
addopts = ["-q", "--import-mode=importlib"]
markers = [
    "camera: needs the borescope plugged in; enabled with --camera",
    "live_ai: sends a frame to a local vision model; enabled with --live-ai",
]

[tool.mutmut]
source_paths = [
    "src/tower_borescope/device/packets.py",
    "src/tower_borescope/imaging/color.py",
    "src/tower_borescope/measure/",
    "src/tower_borescope/ai/schema.py",
]
tests_dir = ["tests/"]
