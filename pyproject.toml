[project]
name = "tower-borescope"
version = "0.1.0"
description = "Desktop application and USB driver for Geek szitman supercamera borescopes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.5.0",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pydantic==2.13.5",
    "pyside6==6.11.2",
    "python-dotenv>=1.0.1",
    "pyusb==1.3.1",
    "qrcode==8.2",
]

[project.optional-dependencies]
# OBS virtual camera output. pyvirtualcam is GPL-2.0, so the downloadable application
# leaves it out; a source checkout installs it with `uv sync --extra virtual-camera`.
virtual-camera = [
    "pyvirtualcam==0.15.0",
]

[project.scripts]
tower-borescope = "tower_borescope.cli:main"

[dependency-groups]
# imageio-ffmpeg gives CI runners a static ffmpeg for the recording tests; it is not
# distributed with the application.
dev = [
    "imageio-ffmpeg==0.6.0",
    "mutmut>=3.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "radon>=6.0",
    "ruff>=0.8",
]
# Application bundle: PyInstaller. scripts/build_app.sh builds ffmpeg and libusb from
# their release sources.
build = [
    "pyinstaller==6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_borescope"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["_legacy"]

[tool.ruff.lint]
# Same rule selection as the Tower monorepo. C901 enforces the cyclomatic
# complexity ceiling configured below; E501 is covered by the 90-column
# formatter limit and the obs_quality line-length rule.
select = ["E", "F", "I", "W", "B", "UP", "PGH", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tower_borescope"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["tower_borescope"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = ["usb", "usb.*", "qrcode", "qrcode.*", "pyvirtualcam"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Test helper modules (synthetic media, fakes) import each other by module name;
# tests/test_check_limits.py imports scripts/check_limits.py the same way.
pythonpath = ["tests", "scripts"]
addopts = ["-q", "--import-mode=importlib"]
markers = [
    "camera: needs the borescope plugged in; enabled with --camera",
    "live_ai: sends a frame to a local vision model; enabled with --live-ai",
    "timing: asserts a real-time frame rate; skipped in CI and mutation runs",
]

[tool.mutmut]
# The whole package is mutated. mutmut copies tests/, pyproject.toml and uv.lock into
# mutants/ by itself; the limits checker tests import scripts/, and the start-up tests
# read .env.example. The repository-wide limits check is deselected because the mutated
# copy carries mutmut's generated trampolines, which are not repository code. Tests
# marked timing assert real-time frame rates, which parallel mutants slow down.
source_paths = ["src/tower_borescope"]
also_copy = ["scripts/", ".env.example"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "--deselect",
    "tests/test_check_limits.py::test_repository_passes",
    "-m",
    "not timing",
]
