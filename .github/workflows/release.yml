name: Release

# Builds the application bundle and disk image for Apple silicon and Intel Macs.
# A tag such as v0.1.0 publishes both images on a GitHub release together with the
# ffmpeg and libusb source tarballs the build compiled, which are the corresponding
# source for those LGPL components. A manual run only stores them as workflow artifacts.
# scripts/build_app.sh creates its build environment in build/venv from uv.lock without
# extras, so pyvirtualcam (the virtual-camera extra) stays out of the application, and
# installs the OpenCV wheel from scripts/build_opencv.sh, which contains no FFmpeg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} disk image
    runs-on: ${{ matrix.runner }}
    # The OpenCV compile takes about three minutes with four jobs on an M1 Pro; a first
    # uncached build on a three-processor runner, the slower Intel runner included, is
    # allowed several times that, next to about half an hour for ffmpeg, libusb, the
    # bundle and the tests.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install nasm for libjpeg-turbo's SIMD code in the Intel OpenCV build
        if: matrix.arch == 'x86_64'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm

      - name: Compute the OpenCV cache key
        # The key names the OpenCV version, the architecture and a hash of the options.
        id: opencv
        run: echo "key=$(scripts/build_opencv.sh --key)" >> "$GITHUB_OUTPUT"

      - name: Restore the OpenCV build
        id: opencv-cache
        uses: actions/cache/restore@v4
        with:
          path: build/${{ steps.opencv.outputs.key }}
          key: ${{ steps.opencv.outputs.key }}

      - name: Build OpenCV without FFmpeg
        run: scripts/build_opencv.sh

      - name: Save the OpenCV build
        # Saved as soon as it exists, so a failure in a later step keeps the compile.
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ steps.opencv.outputs.key }}
          key: ${{ steps.opencv.outputs.key }}

      - name: Keep the OpenCV build logs when a step fails
        # The compile output goes to a log file that the runner deletes with the job.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencv-build-log-${{ matrix.arch }}
          path: |
            build/opencv-*.partial/build.log
            build/opencv-*.partial/cmake-args.txt
            build/opencv_python-*/_skbuild/*/cmake-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Build the bundle and the disk image
        run: scripts/build_app.sh --no-install

      - name: Test imaging, measurement, JPEG and gallery code against the OpenCV build
        # build/venv holds the OpenCV build; the gallery tests read thumbnails with the
        # bundled ffmpeg. A failure here fails the release.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The ffmpeg output folder is build/ffmpeg-<version>-<arch>; the pattern keeps
          # this step correct when scripts/build_app.sh moves to a new ffmpeg release.
          ffmpeg_dirs=(build/ffmpeg-*-${{ matrix.arch }})
          [ -x "${ffmpeg_dirs[0]}/ffmpeg" ] || { echo "No bundled ffmpeg build found"; exit 1; }
          export TOWER_BORESCOPE_FFMPEG_PATH="$PWD/${ffmpeg_dirs[0]}/ffmpeg"
          build/venv/bin/pytest tests/test_imaging_*.py tests/test_measure_*.py \
            tests/test_jpeg.py tests/test_app_dialogs_gallery.py -m "not timing" -rs

      - name: Keep the window picture from the built application
        uses: actions/upload-artifact@v4
        with:
          name: test-shot-${{ matrix.arch }}
          path: build/test_shot.png

      - name: Store the disk image
        uses: actions/upload-artifact@v4
        with:
          name: disk-image-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Store the ffmpeg and libusb source tarballs
        # Both architectures build from the same checksum-verified tarballs; one copy.
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: source-tarballs
          path: |
            build/ffmpeg-*.tar.xz
            build/libusb-*.tar.bz2
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect the disk images
        uses: actions/download-artifact@v4
        with:
          pattern: disk-image-*
          merge-multiple: true
          path: images

      - name: Collect the source tarballs
        uses: actions/download-artifact@v4
        with:
          name: source-tarballs
          path: sources

      - name: Create the release with both images and the source tarballs attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            images/*.dmg
            sources/*
          fail_on_unmatched_files: true
          generate_release_notes: true
